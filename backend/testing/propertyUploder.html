<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Property Upload Test</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 30px;
        font-size: 2.5em;
        background: linear-gradient(45deg, #667eea, #764ba2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #555;
      }

      input,
      textarea,
      select {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e1e8ed;
        border-radius: 12px;
        font-size: 16px;
        transition: all 0.3s ease;
        background: rgba(255, 255, 255, 0.9);
      }

      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .details-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 15px;
        margin-top: 10px;
      }

      .file-upload {
        position: relative;
        display: inline-block;
        cursor: pointer;
        width: 100%;
      }

      .file-upload input[type="file"] {
        position: absolute;
        left: -9999px;
      }

      .file-upload-btn {
        display: block;
        padding: 12px 20px;
        background: linear-gradient(45deg, #667eea, #764ba2);
        color: white;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        text-align: center;
        transition: transform 0.2s ease;
      }

      .file-upload-btn:hover {
        transform: translateY(-2px);
      }

      .feature-item {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
        align-items: center;
      }

      .feature-item input {
        flex: 1;
      }

      .remove-btn {
        background: #ff4757;
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
      }

      .add-btn {
        background: #2ed573;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 10px;
      }

      .submit-btn {
        width: 100%;
        background: linear-gradient(45deg, #2ed573, #17a2b8);
        color: white;
        border: none;
        padding: 16px;
        font-size: 18px;
        font-weight: 600;
        border-radius: 12px;
        cursor: pointer;
        margin-top: 30px;
        transition: transform 0.2s ease;
      }

      .submit-btn:hover {
        transform: translateY(-2px);
      }

      .amenity-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 10px;
      }

      .amenity-tag {
        background: #f8f9fa;
        padding: 8px 12px;
        border-radius: 20px;
        border: 2px solid #e9ecef;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .amenity-tag.selected {
        background: #667eea;
        color: white;
        border-color: #667eea;
      }

      #response {
        margin-top: 20px;
        padding: 15px;
        border-radius: 12px;
        display: none;
        word-wrap: break-word;
        overflow-wrap: break-word;
        white-space: pre-wrap;
        max-width: 100%;
        overflow-x: auto;
      }

      #response pre {
        white-space: pre-wrap;
        word-break: break-word;
      }

      #response.success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      #response.error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      .debug-section {
        margin-top: 20px;
        padding: 15px;
        background: #f8f9fa;
        border-radius: 12px;
        border-left: 4px solid #17a2b8;
      }

      .debug-section h3 {
        color: #17a2b8;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🏠 Property Upload Test</h1>
      <form id="propertyForm" enctype="multipart/form-data">
        <div class="form-group">
          <label for="title">Property Title *</label>
          <input
            type="text"
            id="title"
            name="title"
            required
            minlength="10"
            maxlength="50"
            placeholder="Enter property title (10-50 characters)"
          />
        </div>

        <div class="form-group">
          <label for="address">Address *</label>
          <input
            type="text"
            id="address"
            name="address"
            required
            placeholder="Enter property address"
          />
        </div>

        <div class="form-group">
          <label for="description">Description *</label>
          <textarea
            id="description"
            name="description"
            required
            rows="4"
            placeholder="Describe the property..."
          ></textarea>
        </div>

        <div class="form-group">
          <label>Property Details *</label>
          <div class="details-grid">
            <div>
              <label for="bedrooms">Bedrooms</label>
              <input
                type="number"
                id="bedrooms"
                name="bedrooms"
                required
                min="1"
                value="1"
              />
            </div>
            <div>
              <label for="beds">Beds</label>
              <input
                type="number"
                id="beds"
                name="beds"
                required
                min="1"
                value="1"
              />
            </div>
            <div>
              <label for="bathrooms">Bathrooms</label>
              <input
                type="number"
                id="bathrooms"
                name="bathrooms"
                required
                min="1"
                value="1"
              />
            </div>
            <div>
              <label for="maxGuests">Max Guests</label>
              <input
                type="number"
                id="maxGuests"
                name="maxGuests"
                required
                min="1"
                value="1"
              />
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="imageCover">Cover Image *</label>
          <div class="file-upload">
            <input
              type="file"
              id="imageCover"
              name="imageCover"
              accept="image/*"
              required
            />
            <label for="imageCover" class="file-upload-btn"
              >📸 Choose Cover Image</label
            >
          </div>
        </div>

        <div class="form-group">
          <label for="images">Additional Images</label>
          <div class="file-upload">
            <input
              type="file"
              id="images"
              name="images"
              accept="image/*"
              multiple
            />
            <label for="images" class="file-upload-btn"
              >🖼️ Choose Additional Images</label
            >
          </div>
        </div>

        <div class="form-group">
          <label>Amenities</label>
          <div class="amenity-tags">
            <div class="amenity-tag" data-amenity="wifi">WiFi</div>
            <div class="amenity-tag" data-amenity="parking">Parking</div>
            <div class="amenity-tag" data-amenity="pool">Swimming Pool</div>
            <div class="amenity-tag" data-amenity="gym">Gym</div>
            <div class="amenity-tag" data-amenity="ac">Air Conditioning</div>
            <div class="amenity-tag" data-amenity="kitchen">Kitchen</div>
            <div class="amenity-tag" data-amenity="balcony">Balcony</div>
            <div class="amenity-tag" data-amenity="garden">Garden</div>
          </div>
          <input type="hidden" id="amenities" name="amenities" />
        </div>

        <div class="form-group">
          <label>Features</label>
          <div id="features">
            <div class="feature-item">
              <input
                type="text"
                name="featureName[]"
                placeholder="Feature name"
              />
              <input
                type="text"
                name="featureDescription[]"
                placeholder="Feature description"
              />
              <button
                type="button"
                class="remove-btn"
                onclick="removeFeature(this)"
              >
                Remove
              </button>
            </div>
          </div>
          <button type="button" class="add-btn" onclick="addFeature()">
            Add Feature
          </button>
        </div>

        <div class="form-group">
          <label for="backendUrl">Backend URL</label>
          <input
            type="text"
            id="backendUrl"
            name="backendUrl"
            value="http://localhost:5000/api/v1/property"
            placeholder="Enter your backend endpoint"
          />
        </div>

        <button type="submit" class="submit-btn">🚀 Upload Property</button>
      </form>

      <div id="response"></div>

      <div class="debug-section" id="debugSection" style="display: none">
        <h3>🔍 Debug Information</h3>
        <pre id="debugInfo"></pre>
      </div>
    </div>

    <script>
      // Handle amenity selection
      document.querySelectorAll(".amenity-tag").forEach((tag) => {
        tag.addEventListener("click", function () {
          this.classList.toggle("selected");
          updateAmenities();
        });
      });

      function updateAmenities() {
        const selected = Array.from(
          document.querySelectorAll(".amenity-tag.selected")
        ).map((tag) => tag.dataset.amenity);
        document.getElementById("amenities").value = JSON.stringify(selected);
      }

      function addFeature() {
        const featuresDiv = document.getElementById("features");
        const featureItem = document.createElement("div");
        featureItem.className = "feature-item";
        featureItem.innerHTML = `
                <input type="text" name="featureName[]" placeholder="Feature name">
                <input type="text" name="featureDescription[]" placeholder="Feature description">
                <button type="button" class="remove-btn" onclick="removeFeature(this)">Remove</button>
            `;
        featuresDiv.appendChild(featureItem);
      }

      function removeFeature(btn) {
        btn.parentElement.remove();
      }

      // Handle form submission
      document
        .getElementById("propertyForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const form = e.target;

          // Create regular form data (not FormData for multipart)
          const formData = new FormData();

          // Add basic fields
          formData.append("title", form.title.value);
          formData.append("address", form.address.value);
          formData.append("description", form.description.value);

          // Add individual detail fields (not nested object)
          formData.append("details[bedrooms]", parseInt(form.bedrooms.value));
          formData.append("details[beds]", parseInt(form.beds.value));
          formData.append("details[bathrooms]", parseInt(form.bathrooms.value));
          formData.append("details[maxGuests]", parseInt(form.maxGuests.value));

          // Add files
          if (form.imageCover.files[0]) {
            formData.append("imageCover", form.imageCover.files[0]);
          }

          for (let file of form.images.files) {
            formData.append("images", file);
          }

          // Add amenities as array (not JSON string)
          const amenities = JSON.parse(form.amenities.value || "[]");
          amenities.forEach((amenity) => {
            formData.append("amenities[]", amenity);
          });

          // Add features as individual objects (not JSON string)
          const featureNames = form.querySelectorAll(
            'input[name="featureName[]"]'
          );
          const featureDescriptions = form.querySelectorAll(
            'input[name="featureDescription[]"]'
          );

          let featureIndex = 0;
          for (let i = 0; i < featureNames.length; i++) {
            if (featureNames[i].value && featureDescriptions[i].value) {
              formData.append(
                `features[${featureIndex}][name]`,
                featureNames[i].value
              );
              formData.append(
                `features[${featureIndex}][description]`,
                featureDescriptions[i].value
              );
              featureIndex++;
            }
          }

          // Debug: Show what's being sent
          const debugInfo = [];
          for (let [key, value] of formData.entries()) {
            debugInfo.push(`${key}: ${value}`);
          }

          document.getElementById("debugSection").style.display = "block";
          document.getElementById("debugInfo").textContent =
            debugInfo.join("\n");

          try {
            const response = await fetch(form.backendUrl.value, {
              method: "POST",
              body: formData,
            });

            const result = await response.text();
            const responseDiv = document.getElementById("response");
            responseDiv.style.display = "block";

            if (response.ok) {
              responseDiv.className = "success";
              responseDiv.innerHTML = `✅ Success! Property uploaded successfully.<br><pre>${result}</pre>`;
            } else {
              responseDiv.className = "error";
              responseDiv.innerHTML = `❌ Error: ${response.status}<br><pre>${result}</pre>`;
            }
          } catch (error) {
            const responseDiv = document.getElementById("response");
            responseDiv.style.display = "block";
            responseDiv.className = "error";
            responseDiv.innerHTML = `❌ Network Error: ${error.message}`;
          }
        });

      // File upload feedback
      document
        .getElementById("imageCover")
        .addEventListener("change", function (e) {
          const label = document.querySelector('label[for="imageCover"]');
          if (e.target.files.length > 0) {
            label.textContent = `📸 Selected: ${e.target.files[0].name}`;
          }
        });

      document
        .getElementById("images")
        .addEventListener("change", function (e) {
          const label = document.querySelector('label[for="images"]');
          if (e.target.files.length > 0) {
            label.textContent = `🖼️ Selected: ${e.target.files.length} images`;
          }
        });
    </script>
  </body>
</html>
