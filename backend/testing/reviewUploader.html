<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Review Upload Test</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(
          135deg,
          #ff9a9e 0%,
          #fecfef 50%,
          #fecfef 100%
        );
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 600px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 30px;
        font-size: 2.5em;
        background: linear-gradient(45deg, #ff9a9e, #fecfef);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .form-group {
        margin-bottom: 25px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #555;
      }

      input,
      textarea,
      select {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e1e8ed;
        border-radius: 12px;
        font-size: 16px;
        transition: all 0.3s ease;
        background: rgba(255, 255, 255, 0.9);
      }

      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: #ff9a9e;
        box-shadow: 0 0 0 3px rgba(255, 154, 158, 0.1);
      }

      .rating-container {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .star-rating {
        display: flex;
        gap: 5px;
      }

      .star {
        font-size: 30px;
        color: #ddd;
        cursor: pointer;
        transition: color 0.2s ease;
      }

      .star.active {
        color: #ffd700;
      }

      .star:hover {
        color: #ffed4e;
      }

      .rating-text {
        font-size: 18px;
        font-weight: 600;
        color: #666;
      }

      .file-upload {
        position: relative;
        display: inline-block;
        cursor: pointer;
        width: 100%;
      }

      .file-upload input[type="file"] {
        position: absolute;
        left: -9999px;
      }

      .file-upload-btn {
        display: block;
        padding: 12px 20px;
        background: linear-gradient(45deg, #ff9a9e, #fecfef);
        color: white;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        text-align: center;
        transition: transform 0.2s ease;
      }

      .file-upload-btn:hover {
        transform: translateY(-2px);
      }

      .photo-preview {
        margin-top: 15px;
        text-align: center;
      }

      .photo-preview img {
        max-width: 150px;
        max-height: 150px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #ff9a9e;
      }

      .submit-btn {
        width: 100%;
        background: linear-gradient(45deg, #ff9a9e, #fad0c4);
        color: white;
        border: none;
        padding: 16px;
        font-size: 18px;
        font-weight: 600;
        border-radius: 12px;
        cursor: pointer;
        margin-top: 30px;
        transition: transform 0.2s ease;
      }

      .submit-btn:hover {
        transform: translateY(-2px);
      }

      #response {
        margin-top: 20px;
        padding: 15px;
        border-radius: 12px;
        display: none;
        word-wrap: break-word; /* break long words */
        overflow-wrap: break-word;
        white-space: pre-wrap; /* wrap <pre> text */
        max-width: 100%; /* keep inside container */
        overflow-x: auto; /* allow horizontal scroll if too wide */
      }

      #response pre {
        white-space: pre-wrap; /* preserve newlines, wrap long lines */
        word-break: break-word;
      }

      #response.success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      #response.error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      .property-search {
        position: relative;
      }

      .search-results {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: white;
        border: 2px solid #e1e8ed;
        border-top: none;
        border-radius: 0 0 12px 12px;
        max-height: 200px;
        overflow-y: auto;
        z-index: 1000;
        display: none;
      }

      .search-result {
        padding: 12px 16px;
        cursor: pointer;
        border-bottom: 1px solid #f8f9fa;
        transition: background-color 0.2s ease;
      }

      .search-result:hover {
        background-color: #f8f9fa;
      }

      .search-result:last-child {
        border-bottom: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>⭐ Review Upload Test</h1>
      <form id="reviewForm" enctype="multipart/form-data">
        <div class="form-group">
          <label for="user">User Name *</label>
          <input
            type="text"
            id="user"
            name="user"
            required
            placeholder="Enter your name"
          />
        </div>

        <div class="form-group">
          <label for="photo">User Photo *</label>
          <div class="file-upload">
            <input
              type="file"
              id="photo"
              name="photo"
              accept="image/*"
              required
            />
            <label for="photo" class="file-upload-btn"
              >📸 Choose Profile Photo</label
            >
          </div>
          <div class="photo-preview" id="photoPreview"></div>
        </div>

        <div class="form-group">
          <label for="review">Review *</label>
          <textarea
            id="review"
            name="review"
            required
            rows="5"
            placeholder="Write your review here..."
          ></textarea>
        </div>

        <div class="form-group">
          <label>Rating *</label>
          <div class="rating-container">
            <div class="star-rating">
              <span class="star" data-rating="1">★</span>
              <span class="star" data-rating="2">★</span>
              <span class="star active" data-rating="3">★</span>
              <span class="star" data-rating="4">★</span>
              <span class="star" data-rating="5">★</span>
            </div>
            <span class="rating-text">3 stars</span>
          </div>
          <input type="hidden" id="rating" name="rating" value="3" />
        </div>

        <div class="form-group">
          <label for="property">Property ID *</label>
          <div class="property-search">
            <input
              type="text"
              id="property"
              name="property"
              required
              placeholder="Enter Property ID or search properties"
            />
            <div class="search-results" id="searchResults"></div>
          </div>
        </div>

        <div class="form-group">
          <label for="backendUrl">Backend URL</label>
          <input
            type="text"
            id="backendUrl"
            name="backendUrl"
            value="http://localhost:5000/api/v1/review"
            placeholder="Enter your backend endpoint"
          />
        </div>

        <button type="submit" class="submit-btn">🌟 Submit Review</button>
      </form>

      <div id="response"></div>
    </div>

    <script>
      // Star rating functionality
      const stars = document.querySelectorAll(".star");
      const ratingInput = document.getElementById("rating");
      const ratingText = document.querySelector(".rating-text");

      stars.forEach((star) => {
        star.addEventListener("click", function () {
          const rating = parseInt(this.dataset.rating);
          ratingInput.value = rating;
          ratingText.textContent = `${rating} star${rating !== 1 ? "s" : ""}`;

          // Update star display
          stars.forEach((s, index) => {
            if (index < rating) {
              s.classList.add("active");
            } else {
              s.classList.remove("active");
            }
          });
        });

        star.addEventListener("mouseenter", function () {
          const rating = parseInt(this.dataset.rating);
          stars.forEach((s, index) => {
            if (index < rating) {
              s.style.color = "#ffed4e";
            } else {
              s.style.color = "#ddd";
            }
          });
        });
      });

      document
        .querySelector(".star-rating")
        .addEventListener("mouseleave", function () {
          const currentRating = parseInt(ratingInput.value);
          stars.forEach((s, index) => {
            if (index < currentRating) {
              s.style.color = "#ffd700";
            } else {
              s.style.color = "#ddd";
            }
          });
        });

      // Photo preview functionality
      document.getElementById("photo").addEventListener("change", function (e) {
        const file = e.target.files[0];
        const label = document.querySelector('label[for="photo"]');
        const preview = document.getElementById("photoPreview");

        if (file) {
          label.textContent = `📸 Selected: ${file.name}`;

          const reader = new FileReader();
          reader.onload = function (e) {
            preview.innerHTML = `<img src="${e.target.result}" alt="Photo preview">`;
          };
          reader.readAsDataURL(file);
        }
      });

      // Property search functionality (mock data for demo)
      const mockProperties = [
        { id: "507f1f77bcf86cd799439011", title: "Cozy Downtown Apartment" },
        { id: "507f191e810c19729de860ea", title: "Luxury Beach Villa" },
        { id: "507f191e810c19729de860eb", title: "Mountain Cabin Retreat" },
        { id: "507f191e810c19729de860ec", title: "Urban Loft Studio" },
        { id: "507f191e810c19729de860ed", title: "Suburban Family House" },
      ];

      const propertyInput = document.getElementById("property");
      const searchResults = document.getElementById("searchResults");

      propertyInput.addEventListener("input", function () {
        const query = this.value.toLowerCase();
        if (query.length > 2) {
          const filtered = mockProperties.filter(
            (prop) =>
              prop.title.toLowerCase().includes(query) ||
              prop.id.includes(query)
          );

          if (filtered.length > 0) {
            searchResults.innerHTML = filtered
              .map(
                (prop) =>
                  `<div class="search-result" data-id="${prop.id}">${prop.title} (${prop.id})</div>`
              )
              .join("");
            searchResults.style.display = "block";
          } else {
            searchResults.style.display = "none";
          }
        } else {
          searchResults.style.display = "none";
        }
      });

      searchResults.addEventListener("click", function (e) {
        if (e.target.classList.contains("search-result")) {
          propertyInput.value = e.target.dataset.id;
          searchResults.style.display = "none";
        }
      });

      document.addEventListener("click", function (e) {
        if (!e.target.closest(".property-search")) {
          searchResults.style.display = "none";
        }
      });

      // Handle form submission
      document
        .getElementById("reviewForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const formData = new FormData();
          const form = e.target;

          // Add form fields
          formData.append("user", form.user.value);
          formData.append("review", form.review.value);
          formData.append("rating", form.rating.value);
          formData.append("property", form.property.value);

          // Add photo file
          if (form.photo.files[0]) {
            formData.append("photo", form.photo.files[0]);
          }

          try {
            const response = await fetch(form.backendUrl.value, {
              method: "POST",
              body: formData,
            });

            const result = await response.text();
            const responseDiv = document.getElementById("response");
            responseDiv.style.display = "block";

            if (response.ok) {
              responseDiv.className = "success";
              responseDiv.innerHTML = `✅ Success! Review submitted successfully.<br><pre>${result}</pre>`;
              form.reset();
              document.getElementById("photoPreview").innerHTML = "";
              // Reset rating to default
              ratingInput.value = 3;
              ratingText.textContent = "3 stars";
              stars.forEach((s, index) => {
                if (index < 3) {
                  s.classList.add("active");
                } else {
                  s.classList.remove("active");
                }
              });
            } else {
              responseDiv.className = "error";
              responseDiv.innerHTML = `❌ Error: ${response.status}<br><pre>${result}</pre>`;
            }
          } catch (error) {
            const responseDiv = document.getElementById("response");
            responseDiv.style.display = "block";
            responseDiv.className = "error";
            responseDiv.innerHTML = `❌ Network Error: ${error.message}`;
          }
        });
    </script>
  </body>
</html>
